<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveTune</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d111b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DriveTune">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
    <main class="app">
        <header class="header">
            <p class="logo">DriveTune</p>
            <p class="subtitle">MUSIC FOR YOUR DRIVE</p>
        </header>

        <section class="hero">
            <p class="eyebrow">YOUR DRIVE, YOUR MUSIC</p>
            <h1>今の気分に、<br>ぴったりの音楽を。</h1>
            <p class="description">
                気分や景色を伝えるだけで、<br>
                ドライブに合う音楽を見つけよう。
            </p>
        </section>

        <section class="voice-section">
            <div class="mic-icon">🎙</div>
            <h2>声で選曲する</h2>
            <p>「夕暮れの海に合うエモい曲」</p>
            <button id="voiceButton" type="button">
                音声選曲を始める
            </button>
            <p id="status" class="status" aria-live="polite">
                音声機能は次のステップで追加します
            </p>
            <p id="recognizedText" class="recognized-text"></p>
        </section>

        <section class="mood-section">
            <h2>気分から選ぶ</h2>
            <p id="selectedMood">まだ気分が選択されていません</p>
            <div class="mood-grid">
                <button class="mood-card" type="button"
                    data-mood="エモい">
                    <span>🌅</span>
                    <strong>エモい</strong>
                    <small>切ない・懐かしい</small>
                </button>

                <button class="mood-card" type="button"
                    data-mood="爽快">
                    <span>☀️</span>
                    <strong>爽快</strong>
                    <small>明るい・開放的</small>
                </button>

                <button class="mood-card" type="button"
                    data-mood="落ち着く">
                    <span>🌊</span>
                    <strong>落ち着く</strong>
                    <small>穏やか・リラックス</small>
                </button>

                <button class="mood-card" type="button"
                    data-mood="幻想的">
                    <span>🌙</span>
                    <strong>幻想的</strong>
                    <small>夜・ミステリアス</small>
                </button>
            </div>
            <div class="playlist-section">
                <p id="playlistMessage">
                    気分を選ぶと、プレイリストを開けます。
                </p>

                <a
                    id="playlistLink"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="playlist-button"
                    hidden
                >
                    YouTube Musicでプレイリストを開く ↗
                </a>
            </div>

        </section>

        <footer>
            <p>DriveTune — Find your driving soundtrack.</p>
        </footer>
    </main>

    <script src="script.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js");
        });
    }
    </script>
</body>
</html>
